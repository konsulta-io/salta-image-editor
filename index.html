<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Editor</title>
    <link rel="stylesheet" type="text/css" href="./public/style.css" />
    <style>
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
      }
      .editor-container {
        height: 100vh;
        width: 100vw;
      }
    </style>
  </head>

  <body>
    <div class="editor-container" id="editor_container">
      <div class="plugin-spinner">
        <img class="loading" src="./public/assets/loading.svg" alt="loading" />
      </div>
    </div>

    <script type="module" src="./public/init.js"></script>
    <script src="https://cdn.scaleflex.it/plugins/js-cloudimage-responsive/4.8.5/js-cloudimage-responsive.min.js"></script>
    <script src="https://cdn.scaleflex.it/filerobot/js-cloudimage-responsive/lazysizes.min.js"></script>
    <script>
      const ciResponsive = new window.CIResponsive({
        token: 'scaleflex',
        baseURL: 'https://scaleflex.cloudimg.io/v7/demo/',
        params: 'org_if_sml=1&version=16.04.2020',
        lazyLoading: true,
        exactSize: false,
        limitFactor: 10,
        apiVersion: 'v7',
        lowQualityPreview: {
          minImgWidth: 180,
        },
      });
    </script>
  </body>
</html>
